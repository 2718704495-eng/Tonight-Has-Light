  - order: 1
    id: scene_01_home_shot_001
    beat: "门内归家全景：整屋稳定明亮；成年人仍穿着灰蓝无标识外搭，猫在右侧脚边；挂钩为空，桌上已有壶、两杯、米饭和汤，中央浅盘的暖赭热菜尚未端上桌。"
