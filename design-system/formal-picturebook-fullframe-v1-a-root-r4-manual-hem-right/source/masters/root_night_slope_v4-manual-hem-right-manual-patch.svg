  <path d="M34 128 C82 110 135 116 194 149" fill="none" stroke="#07101f" stroke-width="4.2" opacity="0.36" stroke-linecap="round"/>

  <!-- Screen-right lifted hem as one low-contrast cloth surface, not motion lines. -->
